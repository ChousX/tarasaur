[package]
name = "tarasaur"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Smooth, editable, GPU-meshed voxel terrain for Bevy, with streaming LOD and persistence"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ChousX/tarasaur"
readme = "README.md"
keywords = ["bevy", "voxel", "terrain", "gamedev", "surface-nets"]
categories = ["game-development", "rendering"]
# Dev tooling and bench output stay out of the published crate.
exclude = [
    "/bench_results",
    "/saves",
    "/captures",
    "/docs",
    "/tools",
    "/nix",
    "/flake.nix",
    "/flake.lock",
    "/clippy.toml",
    "/.gitignore",
]

[dependencies]
# Only the parts the library uses; the app's own `bevy` dependency picks
# the platform features (windowing, audio, UI, ...).
bevy = { version = "0.20", default-features = false, features = [
    "std",
    "multi_threaded",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_window",
    "bevy_pbr",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_gizmos",
    "bevy_gizmos_render",
] }
bytemuck = "1.25.2"
crossbeam-channel = "0.5.16"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["serde_derive"] }
thiserror = "2.0.20"
# Only for the `tracy` feature: on-demand mode, so profiling starts when
# Tracy connects instead of buffering everything from launch.
tracy-client = { version = "0.19", optional = true, features = ["ondemand"] }

[dev-dependencies]
# Examples open windows and take input, so they need Bevy's default features.
bevy = "0.20"
# The bench's `--renderdoc` frame capture.
renderdoc = "0.12.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3


[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Bevy system params (Res, Query, Extract, On, ...) must be taken by value.
needless_pass_by_value = "allow"
# DENY PANICS:
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[package.metadata.docs.rs]
all-features = true

[features]
# Profile with Tracy: `cargo run --release --features tracy --example bench`
tracy = ["bevy/trace_tracy", "dep:tracy-client"]
